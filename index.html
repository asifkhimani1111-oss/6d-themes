
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21094e">
<title>AA MAGIC 3D–6D GAME WORLD</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:white;
 background:linear-gradient(145deg,#160638,#421080,#087b9d);
 min-height:100vh;
}
header{text-align:center;padding:25px 12px}
.logo{font-size:55px}
h1{
 font-size:27px;
 color:#ffdf60;
 text-shadow:0 3px 15px #ff60d5;
}
header p{color:#eee}
.stats{display:flex;justify-content:center;gap:12px}
.stat{background:#ffffff25;padding:12px 20px;border-radius:15px}
h2{text-align:center}
.games{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;padding:12px;max-width:850px;margin:auto;
}
.game{
 background:linear-gradient(145deg,#ffffff35,#ffffff0c);
 border:1px solid #ffffff55;border-radius:20px;
 padding:20px 5px;text-align:center;
 cursor:pointer;box-shadow:0 7px 18px #0004;
}
.game:active{transform:scale(.94)}
.emoji{font-size:43px;display:block}
.game b{display:block;margin-top:10px}
#play{
 display:none;text-align:center;padding:15px;
 margin:15px auto;max-width:600px;
 background:#ffffff20;border-radius:22px;
 min-height:350px;
}
#question{font-size:23px;margin:22px 5px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.option{
 background:#ffffff25;color:white;
 border:2px solid #ffffff55;border-radius:15px;
 padding:17px 5px;font-size:21px;cursor:pointer;
}
.action{
 border:0;border-radius:15px;padding:13px 22px;
 background:linear-gradient(90deg,#ffdf4c,#ff873e);
 color:#35105a;font-size:17px;font-weight:bold;
 margin:10px;cursor:pointer;
}
.back{background:#ffffff30;color:white}
#message{min-height:35px;margin:15px}
footer{text-align:center;padding:25px}
@media(min-width:650px){
 .games{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header>
 <div class="logo">🌈✨🎮✨🌈</div>
 <h1>AA MAGIC 3D–6D<br>GAME WORLD</h1>
 <p>ગુજરાતી બાળકોની જાદુઈ ગેમ દુનિયા</p>
 <div class="stats">
  <div class="stat">⭐ પોઇન્ટ: <b id="score">0</b></div>
  <div class="stat">🏆 લેવલ: <b id="level">1</b></div>
 </div>
</header>

<h2>🎮 તમારી ગેમ પસંદ કરો</h2>
<div class="games" id="games"></div>

<section id="play">
 <h2 id="gameTitle"></h2>
 <div id="bigEmoji" style="font-size:48px"></div>
 <div id="question"></div>
 <div class="options" id="options"></div>
 <div id="message"></div>
 <button class="action" id="next" onclick="nextRound()" hidden>આગળ રમો ➜</button>
 <br>
 <button class="action back" onclick="goHome()">🏠 બધી ગેમ</button>
</section>

<footer>🌟 AA MAGIC 3D–6D GAME WORLD 🌟</footer>

<script>
const list=[
["🫧","Bubble Pop"],["🟣","Magic Slime"],
["🃏","Memory Cards"],["🎨","રંગ ઓળખો"],
["➕","ગણિત ચેલેન્જ"],["⭐","Star Catcher"],
["🐼","Animal Quiz"],["🔢","Number Puzzle"],
["🔷","Shape Match"],["✊","Rock Paper Scissors"],
["📚","Gujarati Word Game"],["⚡","Magic Tap Challenge"]
];

let score=0,level=1,current=0,answered=false;
let first=null,locked=false;

const el=id=>document.getElementById(id);

list.forEach((g,i)=>{
 const d=document.createElement("div");
 d.className="game";
 d.innerHTML=`<span class="emoji">${g[0]}</span><b>${g[1]}</b>`;
 d.onclick=()=>startGame(i);
 el("games").appendChild(d);
});

function shuffle(a){
 return a.sort(()=>Math.random()-.5);
}
function goHome(){
 el("play").style.display="none";
 el("games").style.display="grid";
}
function startGame(i){
 current=i;
 el("games").style.display="none";
 el("play").style.display="block";
 el("gameTitle").textContent=list[i][1];
 el("bigEmoji").textContent=list[i][0];
 nextRound();
}
function update(){
 el("score").textContent=score;
 level=Math.floor(score/100)+1;
 el("level").textContent=level;
}
function choices(q,answer,arr){
 answered=false;
 el("question").textContent=q;
 el("message").textContent="";
 el("next").hidden=true;
 el("options").innerHTML="";
 shuffle(arr).forEach(x=>{
  const b=document.createElement("button");
  b.className="option";
  b.textContent=x;
  b.onclick=()=>check(x,answer);
  el("options").appendChild(b);
 });
}
function check(x,answer){
 if(answered)return;
 answered=true;
 if(x===answer){
  score+=10;update();
  el("message").textContent="🎉 શાબાશ! +10 ⭐";
 }else{
  el("message").textContent="😊 સાચો જવાબ: "+answer;
 }
 el("next").hidden=false;
}
function nextRound(){
 el("options").innerHTML="";
 el("message").textContent="";
 el("next").hidden=true;
 answered=false;

 if([0,1,5,11].includes(current)){
  special();return;
 }
 if(current===2){memory();return}
 if(current===9){rps();return}

 let q,a,c;
 const data={
  3:[
   ["લાલ રંગ કયો?","🔴",["🔴","🔵","🟢","🟡"]],
   ["લીલો રંગ કયો?","🟢",["🔴","🟢","🟣","🟡"]],
   ["વાદળી રંગ કયો?","🔵",["🔴","🔵","🟢","🟡"]]
  ],
  6:[
   ["🐘 આ કયું પ્રાણી?","હાથી",["હાથી","સિંહ","વાંદરો","બિલાડી"]],
   ["🦁 આ કયું પ્રાણી?","સિંહ",["હાથી","સિંહ","ઘોડો","બિલાડી"]],
   ["🐼 આ કયું પ્રાણી?","પાંડા",["વાઘ","પાંડા","હરણ","સિંહ"]]
  ],
  8:[
   ["ત્રિકોણ કયો?","🔺",["🔺","🔵","🟩","⭐"]],
   ["ગોળ આકાર કયો?","🔵",["🔺","🔵","🟩","⭐"]],
   ["ચોરસ કયો?","🟩",["⭐","🔵","🟩","🔺"]]
  ],
  10:[
   ["Apple નો ગુજરાતી શબ્દ?","સફરજન",["સફરજન","કેરી","કેળું","દ્રાક્ષ"]],
   ["Sun નો ગુજરાતી શબ્દ?","સૂર્ય",["ચંદ્ર","તારો","સૂર્ય","વાદળ"]],
   ["Water નો ગુજરાતી શબ્દ?","પાણી",["દૂધ","પાણી","તેલ","રસ"]]
  ]
 };

 if(current===4){
  let x=Math.floor(Math.random()*20)+1;
  let y=Math.floor(Math.random()*20)+1;
  q=`${x} + ${y} = કેટલા?`;
  a=String(x+y);
  c=numbers(+a);
 }else if(current===7){
  let x=Math.floor(Math.random()*8)+1;
  q=`${x}, ${x+2}, ${x+4}, આગળ?`;
  a=String(x+6);c=numbers(+a);
 }else{
  [q,a,c]=data[current][Math.floor(Math.random()*data[current].length)];
 }
 choices(q,a,c);
}
function numbers(a){
 let s=new Set([a]);
 while(s.size<4)s.add(a+Math.floor(Math.random()*9)-4);
 return [...s].map(String);
}
function special(){
 const icons=["🟡","🔵","🟣","🟢","🔴","⭐","💎","🫧"];
 const target=icons[Math.floor(Math.random()*icons.length)];
 el("bigEmoji").textContent=target;
 el("question").textContent="યોગ્ય વસ્તુ શોધીને ટચ કરો!";
 shuffle([target,...Array.from({length:7},()=>icons[Math.floor(Math.random()*icons.length)])]).forEach(x=>{
  let b=document.createElement("button");
  b.className="option";b.style.fontSize="35px";b.textContent=x;
  b.onclick=()=>{
   if(answered)return;
   answered=true;
   if(x===target){
    score+=10;update();el("message").textContent="🎉 સરસ! +10 ⭐";
   }else el("message").textContent="😊 ફરી પ્રયત્ન કરો!";
   el("next").hidden=false;
  };
  el("options").appendChild(b);
 });
}
function memory(){
 el("question").textContent="એકસરખા બે કાર્ડ શોધો!";
 first=null;locked=false;
 let arr=shuffle(["🐼","🦄","🐸","🚀","🌈","🐱","🐼","🦄","🐸","🚀","🌈","🐱"]);
 arr.forEach(x=>{
  let b=document.createElement("button");
  b.className="option";b.textContent="❔";b.dataset.answer=x;
  b.onclick=()=>{
   if(locked||b.dataset.done||b===first)return;
   b.textContent=x;
   if(!first){first=b;return}
   if(first.dataset.answer===x){
    first.dataset.done="1";b.dataset.done="1";
    first=null;score+=10;update();
    el("message").textContent="🎉 જોડી મળી!";
    if([...el("options").children].every(x=>x.dataset.done)){
     el("message").textContent="🏆 બધા કાર્ડ મળી ગયા!";
     el("next").hidden=false;
    }
   }else{
    locked=true;
    setTimeout(()=>{
     first.textContent="❔";b.textContent="❔";
     first=null;locked=false;
    },700);
   }
  };
  el("options").appendChild(b);
 });
}
function rps(){
 el("question").textContent="તમારી પસંદગી કરો!";
 ["✊ પથ્થર","✋ કાગળ","✌️ કાતર"].forEach((x,i)=>{
  let b=document.createElement("button");
  b.className="option";b.textContent=x;
  b.onclick=()=>{
   if(answered)return;
   answered=true;
   let bot=Math.floor(Math.random()*3);
   let result=(i-bot+3)%3;
   el("message").textContent="કમ્પ્યુટર: "+["✊ પથ્થર","✋ કાગળ","✌️ કાતર"][bot];
   if(result===0)el("message").textContent+=" — બરાબર!";
   else if(result===1){
    score+=10;update();el("message").textContent+=" — તમે જીત્યા! +10 ⭐";
   }else el("message").textContent+=" — કમ્પ્યુટર જીત્યું!";
   el("next").hidden=false;
  };
  el("options").appendChild(b);
 });
}
</script>
</body>
</html>
